name: Verify priority channels

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iptv-refresh
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install media and Chinese OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-chi-sim
      - name: Test verification and publication rules
        run: python -m unittest discover -q
      - name: Verify custom priority channels
        id: verify
        continue-on-error: true
        run: python -u scripts/priority.py
      - name: Commit independently dated priority results
        if: steps.verify.outcome == 'success' || steps.verify.outcome == 'failure'
        run: |
          if [ ! -f work/priority-part.json ]; then exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists/priority.m3u playlists/priority.txt reports/priority.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh verified priority channels"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Archive focused validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: priority-evidence
          path: |
            work/priority-*.json
            reports/priority.json
            playlists/priority.*
          retention-days: 14
      - name: Fail when no priority channel passed
        if: steps.verify.outcome != 'success'
        run: exit 1
