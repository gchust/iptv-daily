name: Refresh live TV

on:
  schedule:
    - cron: '23 22 * * *' # Daily 06:23 Asia/Shanghai (UTC+8)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum candidate URLs to test (1-5000); blank uses config'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: iptv-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run unit and media integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m unittest discover -v
      - name: Collect once and assign independent host groups
        id: plan
        env:
          IPTV_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          args=()
          if [ -n "$IPTV_LIMIT" ]; then args+=(--limit "$IPTV_LIMIT"); fi
          python -u scripts/pipeline.py plan "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-plan
          path: work/plan.json
          retention-days: 7
          if-no-files-found: error

  verify:
    needs: collect
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.collect.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: candidate-plan
          path: work
      - name: Install media and Chinese OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-chi-sim
      - name: Verify every assigned candidate
        env:
          IPTV_SHARD: ${{ matrix.shard }}
        run: python -u scripts/pipeline.py probe --index "$IPTV_SHARD" --result "work/part-$IPTV_SHARD.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-part-${{ matrix.shard }}
          path: work/part-*.json
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [collect, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: candidate-plan
          path: work
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: verified-part-*
          merge-multiple: true
          path: work/results
      - name: Validate completeness before publishing
        id: merge
        continue-on-error: true
        run: python scripts/pipeline.py merge
      - name: Publish run summary
        if: always()
        run: |
          if [ -f reports/summary.md ]; then cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Commit verified playlists and health report
        if: steps.merge.outcome == 'success' || steps.merge.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all playlists reports
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh verified TV streams"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Archive verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.run_id }}
          path: |
            reports/
            playlists/
          retention-days: 14
          if-no-files-found: ignore
      - name: Fail visibly when publication fails
        if: steps.merge.outcome != 'success'
        run: exit 1
